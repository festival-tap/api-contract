# ==============================================================================
# Specification: festival-tap/api-contract Release & Package Publisher
# ==============================================================================
# Purpose:
#   Publishes immutable, SemVer-versioned contract artifacts whenever a release
#   tag (v*.*.*) is pushed:
#     1. Compiles and deploys `com.festivaltap:api-contract:<version>` JAR to
#        GitHub Packages (consumed by festival-tap/ingress).
#     2. Creates/updates the GitHub Release and attaches the standalone
#        `openapi.yaml` specification (consumed by festival-tap/ui & Swagger UI).
#
# Execution Model:
#   - Extracts `<version>` directly from the Git tag (e.g., `v1.0.0` -> `1.0.0`)
#     and injects it into pom.xml via `versions:set` so POM version never drifts
#     from the immutable Git tag.
#   - Authenticates to GitHub Packages using the built-in `GITHUB_TOKEN`
#     configured via `actions/setup-java` (`server-id: github`).
# ==============================================================================

name: Release — Publish Contract JAR & OpenAPI Spec

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  publish-contract:
    name: Publish DTO JAR & OpenAPI Spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 24 (Temurin) & GitHub Packages auth
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Derive SemVer version from Git tag
        id: semver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set Maven project version to ${{ steps.semver.outputs.version }}
        run: mvn -B versions:set -DnewVersion="${{ steps.semver.outputs.version }}" -DgenerateBackupPoms=false

      - name: Deploy DTO JAR to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B clean deploy

      - name: Create GitHub Release & attach openapi.yaml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.semver.outputs.tag }}" \
            src/main/resources/openapi.yaml \
            --title "${{ steps.semver.outputs.tag }}" \
            --notes "Immutable contract release ${{ steps.semver.outputs.tag }} (Java DTOs published to GitHub Packages + standalone OpenAPI 3.0 specification)." \
            --verify-tag
